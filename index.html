<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#111827" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="NIRA Form" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<title>NIRA - Notice of Birth of a Child</title>
<style>
  /* ---------- Entered data uses the font chosen with the "Load font" button (remembered on this device).
     Rustic Roadway is the built-in default when it is installed or placed beside this file. ---------- */
  @font-face {
    font-family: 'Rustic Roadway';
    src: local('Rustic Roadway'), local('RusticRoadway'), local('Rustic Roadway Regular'),
         url('RusticRoadway.ttf') format('truetype'), url('Rustic Roadway.ttf') format('truetype'),
         url('RusticRoadway.otf') format('opentype'), url('RusticRoadway.woff2') format('woff2');
    font-display: swap;
  }
  :root {
    --hand: 'EntryFont', 'Rustic Roadway', 'Segoe Print', 'Bradley Hand', 'Comic Sans MS', cursive;
    --ink: #111827; --muted: #6b7280; --line: #d1d5db; --accent: #b91c1c; --ok: #15803d;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #e8eaed; font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* ================= QUESTIONNAIRE (screen only) ================= */
  .toolbar { position: sticky; top: 0; z-index: 20; background: #111827; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .toolbar h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .toolbar .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; background: #fff; color: var(--ink); }
  .btn:hover { filter: brightness(0.95); }
  .btn.dark { background: #1f2937; color: #fff; border-color: #374151; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.go { background: var(--ok); color: #fff; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; font-weight: 600; }
  .chip.ok { background: #dcfce7; color: #14532d; }
  .chip.warn { background: #fef3c7; color: #78350f; }

  #wizard { max-width: 860px; margin: 18px auto; padding: 0 12px; }
  .stepper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 14px; }
  .step-tab { border: 1px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 2px; font-size: 12.5px; font-weight: 600; cursor: pointer; color: #374151; }
  .step-tab.active { background: #111827; color: #fff; border-color: #111827; }
  .step-tab.done { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card > header { background: #111827; color: #fff; padding: 14px 18px; }
  .card > header small { color: #fbbf24; font-weight: 700; display: block; font-size: 12px; }
  .card > header h2 { margin: 2px 0 0; font-size: 19px; }
  .card .body { padding: 18px; display: grid; gap: 16px; }
  .card footer { background: #f9fafb; border-top: 1px solid var(--line); padding: 12px 18px; display: flex; justify-content: space-between; gap: 8px; }
  .grp { display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr); }
  .grp .s3 { grid-column: span 3; } .grp .s4 { grid-column: span 4; } .grp .s6 { grid-column: span 6; } .grp .s8 { grid-column: span 8; } .grp .s12 { grid-column: span 12; }
  @media (max-width: 640px) { .grp > * { grid-column: span 12 !important; } .stepper { grid-template-columns: repeat(5, 1fr); } .step-tab span { font-size: 10px; } }
  .sub { font-size: 11.5px; font-weight: 700; text-transform: none; color: var(--muted); border-top: 1px solid #eef0f2; padding-top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .f { display: block; }
  .f > span { display: block; font-size: 12px; font-weight: 700; color: #374151; margin-bottom: 4px; }
  .f input, .f select, .wiz-seg-row input { width: 100%; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 16px; background: #fff; color: var(--ink); }
  .f input:focus, .f select:focus, .wiz-seg-row input:focus { outline: 2px solid #111827; outline-offset: 0; }
  .wiz-seg-row { display: flex; align-items: center; gap: 6px; }
  .wiz-seg-row input { text-align: center; padding: 10px 4px; }
  .wiz-seg-row b { color: #9ca3af; }
  .mini { border: 0; background: #ecfdf5; color: #065f46; font-weight: 700; font-size: 12px; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
  .preview { background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.6; }
  .preview u { font-weight: 700; text-decoration-style: dotted; }
  .f input[readonly] { background: #f3f4f6; color: #374151; }
  .overlay { position: fixed; inset: 0; background: rgba(17,24,39,.55); z-index: 50; display: none; align-items: flex-start; justify-content: center; padding: 28px 12px; overflow: auto; }
  .overlay.on { display: flex; }
  .dlg { background: #fff; border-radius: 14px; max-width: 680px; width: 100%; padding: 18px 20px; display: grid; gap: 14px; }
  .dlg h3 { margin: 0; font-size: 17px; } .dlg h4 { margin: 0 0 6px; font-size: 13px; color: var(--muted); }
  .dlg .two { display: grid; grid-template-columns: 1fr 160px auto; gap: 8px; align-items: end; }
  .dlg input[type=text] { width: 100%; padding: 10px 11px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 16px; }
  .list { border: 1px solid var(--line); border-radius: 10px; max-height: 300px; overflow: auto; }
  .li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #eef0f2; font-size: 13px; }
  .li:last-child { border-bottom: 0; } .li small { color: var(--muted); display: block; }
  .li .b { display: flex; gap: 6px; }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-color: #cbd5e1; }
  #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 60; display: none; max-width: 92vw; }
  .step-tab { display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.15; }
  .step-tab b { font-size: 15px; } .step-tab span { font-size: 11px; font-weight: 600; }
  @media (max-width: 700px) {
    .toolbar { position: static; padding: 8px 10px; }
    .toolbar h1 { display: none; }
    .toolbar .actions { width: 100%; justify-content: space-between; flex-wrap: nowrap; gap: 6px; }
    .toolbar .btn { padding: 9px 10px; }
    .card .body { padding: 14px; } .card footer { padding: 10px 14px; }
  }
  @media (pointer: coarse) { .btn { min-height: 44px; } .sheet input { pointer-events: none; } }
  @media (max-width: 560px) { .dlg .two { grid-template-columns: 1fr auto; } .dlg .two label:first-child { grid-column: 1 / -1; } }
  #step5 { display: none; }
  #step5.on { display: block; }
  .banner { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
  .banner h2 { margin: 0 0 2px; font-size: 17px; } .banner p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .banner .warnline { color: #92400e; font-weight: 600; margin-top: 6px; display: none; }

  /* ================= OFFICIAL A4 SHEET (matches the NIRA PDF) ================= */
  .page-wrapper { display: none; justify-content: center; padding: 16px 8px 40px; }
  .page-wrapper.on { display: flex; }
  .sheet { width: 210mm; height: 297mm; background: #fff; padding: 9mm 12mm; box-shadow: 0 8px 28px rgba(0,0,0,.2); font-family: Arial, Helvetica, sans-serif; font-size: 9.6pt; color: #000; flex: none; overflow: hidden; }
  .sheet-head { text-align: center; margin-bottom: 3mm; }
  .sheet-head img { height: 17mm; width: auto; display: block; margin: 0 auto 2.5mm; }
  .sheet-head h1 { margin: 0; font-size: 15pt; font-weight: 800; letter-spacing: .2px; }
  .grid { border-top: 1px solid #000; border-left: 1px solid #000; }
  .row { display: grid; }
  .c { border-right: 1px solid #000; border-bottom: 1px solid #000; padding: 0 1.8mm; min-width: 0; display: flex; align-items: center; gap: 1.5mm; }
  .rl { height: 6.2mm; } .ri { height: 7mm; } .rs { height: 6.8mm; } .rt { height: 11mm; flex-direction: column; align-items: stretch; justify-content: center; gap: 0; }
  .c.full { grid-column: 1 / -1; }
  .c b { font-weight: 700; }
  .c > span { white-space: nowrap; }
  .c.rt > span { white-space: normal; }
  .bar { background: #000; color: #fff; font-weight: 700; font-size: 10pt; height: 6.4mm; line-height: 6.4mm; padding-left: 6mm; border: 1px solid #000; border-bottom: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; white-space: pre; }
  .note { font-size: 7.4pt; font-style: italic; }
  .in { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; padding: 0; margin: 0; font-family: var(--hand); font-size: 11pt; line-height: 1.1; color: #000; }
  .in:focus { background: #fef9c3; }
  #tracking { font-family: Arial, Helvetica, sans-serif; font-size: 10pt; letter-spacing: .2px; }
  .seg { display: flex; align-items: center; gap: 1mm; font-weight: 700; }
  .seg .in { text-align: center; }
  .decl { border: 1px solid #000; border-top: 0; padding: 4.5mm 6mm 6mm; line-height: 2.05; font-size: 9.6pt; }
  .dl { border: 0; border-bottom: 1px solid #000; background: transparent; font-family: var(--hand); font-size: 11pt; padding: 0 1mm; outline: 0; vertical-align: baseline; max-width: 100%; }
  .dl:focus { background: #fef9c3; }

  @page { size: A4 portrait; margin: 0; }
  @media print {
    html, body { width: 210mm; height: 297mm; background: #fff !important; margin: 0 !important; padding: 0 !important; overflow: hidden !important; }
    .no-print { display: none !important; }
    .page-wrapper { display: block !important; padding: 0 !important; margin: 0 !important; }
    .sheet { zoom: 1 !important; box-shadow: none !important; margin: 0 !important; page-break-after: avoid; break-after: avoid; }
    .in:focus, .dl:focus { background: transparent !important; }
  }
</style>
</head>

<script>
/* ===================== helpers to build the A4 sheet ===================== */
const I  = (id) => `<input class="in" id="${id}" />`;
const L  = (t, cls = '') => `<div class="c rl ${cls}">${t}</div>`;
const IL = (t, id, cls = 'rs') => `<div class="c ${cls}"><span>${t}</span>${I(id)}</div>`;
const IC = (id, cls = 'ri') => `<div class="c ${cls}">${I(id)}</div>`;
const DATE = (p) => `<div class="c ri"><span class="seg">
    <input class="in" id="${p}_dd" maxlength="2" data-next="${p}_mm" style="width:8mm" /> /
    <input class="in" id="${p}_mm" maxlength="2" data-next="${p}_yyyy" data-prev="${p}_dd" style="width:8mm" /> /
    <input class="in" id="${p}_yyyy" maxlength="4" data-prev="${p}_mm" style="width:13mm" /></span></div>`;
const grid = (cols, inner) => `<div class="row" style="grid-template-columns:${cols}">${inner}</div>`;

function personSheet(p, num, title, who, isMother) {
  const names = grid('31% 26% 43%', L('Surname') + L('Given Name') + L('Other Name') +
                     IC(`${p}_surname`) + IC(`${p}_given`) + IC(`${p}_other`));
  const ids = grid('31% 26% 43%',
      L('Nationality') + L('NIN/AIN/Refugee/Passport') + L('Date of Birth') +
      IC(`${p}_nationality`) + IC(`${p}_nin`) + DATE(`${p}_dob`));
  const parity = isMother ? grid('7.5% 7% 85.5%',
      `<div class="c rt" style="justify-content:center">Parity</div>` + IC(`${p}_parity`, 'rt') +
      `<div class="c rt"><span>Reason for Late Registration <span class="note">(Where Applicable):</span></span>${I(`${p}_late_reason`)}</div>`) : '';
  return `
    <div class="bar">${num}.  ${title}</div>
    <div class="grid" style="border-top:0">
      ${names}${ids}${parity}
      ${grid('100%', `<div class="c rl"><b>${who} Residence</b></div>`)}
      ${grid('31% 32% 37%', IL('Country:', `${p}_res_country`) + IL('District:', `${p}_res_district`) + IL('County:', `${p}_res_county`))}
      ${grid('36% 29% 35%', IL('Sub county:', `${p}_res_subcounty`) + IL('Parish:', `${p}_res_parish`) + IL('Village:', `${p}_res_village`))}
      ${grid('57% 43%', IL('Occupation:', `${p}_occupation`) + IL('Education Level:', `${p}_education`))}
      ${grid('100%', IL('Tel Contact:', `${p}_tel`))}
    </div>`;
}

document.getElementById('sheetBody').innerHTML = `
  <div class="grid" style="margin-bottom:0">
    ${grid('36% 64%', `<div class="c rl"><b>Field Registration No:</b></div>` + IC('tracking', 'rl'))}
  </div>
  <div class="bar" style="border-bottom:0">1.  CHILD</div>
  <div class="grid" style="border-top:0">
    ${grid('31% 26% 19% 24%', L('Surname') + L('Given Name') + L('Other Name') + L('NIN') +
        IC('child_surname') + IC('child_given') + IC('child_other') + IC('child_nin'))}
    ${grid('31% 26% 19% 24%', L('Date of birth (DD/MM/YYYY)') + L('Time of birth') + L('Sex of child (M/F)') + L('Weight at birth (Kg)') +
        DATE('child_dob') +
        `<div class="c ri"><span class="seg"><span>HH</span><input class="in" id="child_tob_hh" maxlength="2" data-next="child_tob_mm" style="width:9mm" /><span>: MM</span><input class="in" id="child_tob_mm" maxlength="2" data-prev="child_tob_hh" style="width:9mm" /></span></div>` +
        IC('child_sex') + IC('child_weight'))}
    ${grid('31% 69%', L('Name of Health Facility', 'rs') + IC('child_facility', 'rs'))}
    ${grid('15% 27% 25% 33%', L('Place of birth', 'rs') + IL('Country:', 'child_pob_country') + IL('District:', 'child_pob_district') + IL('County:', 'child_pob_county'))}
    ${grid('36% 29% 35%', IL('Sub county:', 'child_pob_subcounty') + IL('Parish:', 'child_pob_parish') + IL('Village:', 'child_pob_village'))}
  </div>
  ${personSheet('mother', 2, 'MOTHER’S DETAILS', 'Mother’s', true)}
  ${personSheet('father', 3, 'FATHER’S DETAILS', 'Father’s', false)}
  <div class="bar">4.  DECLARATION</div>
  <div class="decl">
    I, <input class="dl" id="decl_name" style="width:68mm" /> (name), <input class="dl" id="decl_occupation" style="width:52mm" />,
    by occupation residing at <input class="dl" id="decl_residence" style="width:78mm" />, in the district of
    <input class="dl" id="decl_district" style="width:38mm" /> in Uganda, declare that the information above, given by me,
    is true and correct, that I know this of my own knowledge and that my means of knowing this is (briefly state your means
    of knowledge and the capacity in which you give this information) as <input class="dl" id="decl_capacity" style="width:92mm" />
  </div>`;

/* ===================== questionnaire (wizard) ===================== */
const W  = (id, label, span = 's4', ph = '') => `<label class="f ${span}"><span>${label}</span><input class="wiz" id="w_${id}" data-sync="${id}" placeholder="${ph}" /></label>`;
const WD = (p, label, span = 's4') => `<div class="${span}"><span class="f"><span>${label}</span></span><div class="wiz-seg-row">
    <input class="wiz wiz-seg" id="w_${p}_dd" data-sync="${p}_dd" data-next="${p}_mm" maxlength="2" placeholder="DD" inputmode="numeric" style="width:60px" /><b>/</b>
    <input class="wiz wiz-seg" id="w_${p}_mm" data-sync="${p}_mm" data-next="${p}_yyyy" data-prev="${p}_dd" maxlength="2" placeholder="MM" inputmode="numeric" style="width:60px" /><b>/</b>
    <input class="wiz wiz-seg" id="w_${p}_yyyy" data-sync="${p}_yyyy" data-prev="${p}_mm" maxlength="4" placeholder="YYYY" inputmode="numeric" style="width:84px" /></div></div>`;

const digitsOnly = (el) => el.classList.contains('wiz-seg') || /_(dd|mm|yyyy|hh)$/.test(el.id);
function advance(el) {
  const pre = el.id.startsWith('w_') ? 'w_' : '';
  const max = +el.getAttribute('maxlength');
  if (el.value.length >= max && el.dataset.next) document.getElementById(pre + el.dataset.next)?.focus();
}
function backspace(e) {
  const el = e.target, pre = el.id.startsWith('w_') ? 'w_' : '';
  if (e.key === 'Backspace' && !el.value && el.dataset.prev) document.getElementById(pre + el.dataset.prev)?.focus();
}
function updateDeclPreview() {
  const set = (pv, id) => { const v = document.getElementById(id)?.value.trim(); document.getElementById(pv).textContent = v || '__________'; };
  set('pv_name', 'decl_name'); set('pv_occ', 'decl_occupation'); set('pv_res', 'decl_residence');
  set('pv_dist', 'decl_district'); set('pv_cap', 'decl_capacity');
}
document.querySelectorAll('.wiz').forEach(w => {
  const target = document.getElementById(w.dataset.sync);
  if (!target) return;
  w.addEventListener(w.tagName === 'SELECT' ? 'change' : 'input', () => {
    if (digitsOnly(w)) w.value = w.value.replace(/\D/g, '');
    target.value = w.value; advance(w); updateDeclPreview();
  });
  target.addEventListener('input', () => {
    if (digitsOnly(target)) target.value = target.value.replace(/\D/g, '');
    w.value = target.value; advance(target); updateDeclPreview();
  });
  w.addEventListener('keydown', backspace); target.addEventListener('keydown', backspace);
  if (w.tagName === 'INPUT') w.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (currentStep < 5) goToStep(currentStep + 1); } });

const FIELD_IDS = [...document.querySelectorAll('.wiz')].map(w => w.dataset.sync);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (_) { return false; } }
};
const DEFAULT_PREFIX = 'AMU/NIRA/Field-Client-No/', START = '00A1A', SERIAL_RE = /^\d{2}[A-Z]\d[A-Z]$/;
let cfg = Object.assign({ prefix: DEFAULT_PREFIX, next: START }, store.get('nira_cfg', {}));
let clients = store.get('nira_clients', {});
const persist = () => { store.set('nira_cfg', cfg); store.set('nira_clients', clients); };

/* Serial pattern: 2 digits + letter + digit + letter (00A1A, 00A1B … 00A1Z, 00A2A …) */
function nextSerial(s) {
  const rad = [10, 10, 26, 10, 26];
  const a = s.split('').map((ch, i) => rad[i] === 26 ? ch.charCodeAt(0) - 65 : +ch);
  let i = 4;
  while (i >= 0) { a[i]++; if (a[i] < rad[i]) break; a[i] = 0; i--; }
  return a.map((v, k) => rad[k] === 26 ? String.fromCharCode(65 + v) : v).join('');
}
function freeSerial() { // next number that has never been given to a saved client
  let guard = 0;
  while (clients[cfg.prefix + cfg.next] && guard++ < 700000) cfg.next = nextSerial(cfg.next);
  return cfg.prefix + cfg.next;
}
const collect = () => Object.fromEntries(FIELD_IDS.map(id => [id, document.getElementById(id).value]));
const currentId = () => document.getElementById('tracking').value;
const isSaved = () => !!clients[currentId()];
const hasData = () => FIELD_IDS.some(id => id !== 'tracking' && !(id in LOCKED) && document.getElementById(id).value.trim() !== '');
function setAll(data) { FIELD_IDS.forEach(id => setVal(id, data[id] || '')); applyLocked(); updateDeclPreview(); }
function clearFields() { document.getElementById('sheet').reset(); document.querySelectorAll('.wiz').forEach(w => (w.value = '')); }
function persistDraft() { store.set('nira_draft', collect()); }

function refreshStatus() {
  const id = currentId(), saved = isSaved();
  const el = document.getElementById('clientChip');
  el.textContent = (id.split('/').pop() || '—') + (saved ? ' · Saved' : ' · Not saved yet');
  el.className = 'chip ' + (saved ? 'ok' : 'warn');

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), 4500);
}
function saveClient(silent) {
  pushAll();
  const id = currentId(); if (!id) return;
  const isNew = !clients[id];
  clients[id] = { id, savedAt: Date.now(), data: collect() };
  if (isNew && id === cfg.prefix + cfg.next) cfg.next = nextSerial(cfg.next); // number is used up → next client gets a new one
  freeSerial(); persist(); persistDraft(); refreshStatus();
  const cnt = Object.keys(clients).length;
  if (isNew && cnt % 10 === 0) setTimeout(() => toast(cnt + ' clients saved. Please share or export a backup (Menu).'), 1800);
  if (silent !== true) toast('Saved ' + id + '. Next client number: ' + (cfg.prefix + cfg.next));
}
function newClient() {
  if (!isSaved() && hasData()) saveClient(true); // never lose someone you were typing
  clearFields(); setVal('tracking', freeSerial()); applyLocked(); updateDeclPreview();
  persistDraft(); refreshStatus(); goToStep(1);
  toast('New client: ' + currentId());
}
function openRecord(id) {
  if (!isSaved() && hasData()) saveClient(true);
  setAll(clients[id].data); persistDraft(); refreshStatus(); closeClients(); goToStep(1);
}
function deleteRecord(id) {
  if (!confirm('Delete ' + id + '? This number will not be reused.')) return;
  delete clients[id]; persist(); renderClients(); refreshStatus();
}

      <div style="display:flex;gap:8px;flex-wrap:wrap">${navigator.canShare ? '<button class="btn sm" onclick="shareBackup()">Share backup</button>' : ''}

    <p style="margin:0;font-size:12px;color:var(--muted)">Saved on this device and browser only. Export a backup now and then. Working with colleagues? Give each person a different number prefix (for example …/JD/) so numbers never clash, then collect everyone's CSV or backup.</p>`;

function closeClients() { document.getElementById('overlay').classList.remove('on'); }
function applySettings() {
  const p = document.getElementById('set_prefix').value.trim(), n = document.getElementById('set_next').value.trim().toUpperCase();
  if (!p) return alert('Enter a number prefix.');
  if (!SERIAL_RE.test(n)) return alert('Serial must look like 00A1A (2 digits, letter, digit, letter).');
  cfg.prefix = p; cfg.next = n;
  if (!isSaved()) setVal('tracking', freeSerial());
  persist(); persistDraft(); refreshStatus(); renderClients(); toast('Numbering updated. Current client: ' + currentId());
}
function download(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
}
const today = () => new Date().toISOString().slice(0, 10);
function exportClients() { download('nira-clients-' + today() + '.json', JSON.stringify({ cfg, clients }, null, 2), 'application/json'); }
function exportCSV() {
  const q = (v) => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lines = [['saved_at', ...FIELD_IDS].map(q).join(',')];
  Object.values(clients).sort((x, y) => x.savedAt - y.savedAt).forEach(c =>
    lines.push([new Date(c.savedAt).toISOString(), ...FIELD_IDS.map(id => c.data[id] || '')].map(q).join(',')));
  download('nira-clients-' + today() + '.csv', '\ufeff' + lines.join('\r\n'), 'text/csv');
}
async function importClients(e) {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); let n = 0;
    Object.values(j.clients || {}).forEach(c => { if (c && c.id && c.data) { clients[c.id] = c; n++; } });
    freeSerial(); persist(); renderClients(); toast('Imported ' + n + ' client(s).');
  } catch (_) { alert('That file is not a valid backup.'); }
}

/* ===================== entry font: load any font you choose ===================== */
const FONT_KEY = 'nira_entry_font';
let entryFace = null;
const b64ToBuf = (b64) => Uint8Array.from(atob(b64), c => c.charCodeAt(0)).buffer;
function bufToB64(buf) { let s = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
async function applyFont(buf, family) {
  const face = new FontFace(family, buf); await face.load();
  if (family === 'EntryFont' && entryFace) document.fonts.delete(entryFace);
  document.fonts.add(face); if (family === 'EntryFont') entryFace = face;
}
document.getElementById('fontFile').addEventListener('change', async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const buf = await f.arrayBuffer(); await applyFont(buf, 'EntryFont');
    const kept = store.set(FONT_KEY, { name: f.name, data: bufToB64(buf) });
    toast('Font loaded: ' + f.name + (kept ? '' : ' (too large to remember, reload it next time)'));
    if (document.getElementById('overlay').classList.contains('on')) renderClients();
  } catch (err) { alert('That file could not be read as a font. Please choose a .ttf, .otf, .woff or .woff2 file.'); }
  e.target.value = '';
});
(async function initFont() {
  try {
    const s = store.get(FONT_KEY, null);
    if (s && s.data) { await applyFont(b64ToBuf(s.data), 'EntryFont'); return; }
    const legacy = localStorage.getItem('rustic_roadway_font'); // font saved by an earlier version
    if (legacy) await applyFont(b64ToBuf(legacy), 'Rustic Roadway');
  } catch (_) {}
})();

/* ===================== printing ===================== */
function fitSheet() {
  const s = document.getElementById('sheet'); s.style.zoom = 1;
  const avail = document.documentElement.clientWidth - 16;
  if (s.offsetWidth > avail) s.style.zoom = avail / s.offsetWidth;
}
window.addEventListener('resize', () => { if (currentStep === 5) fitSheet(); });
window.addEventListener('beforeprint', () => { document.getElementById('sheet').style.zoom = 1; });
window.addEventListener('afterprint', () => { if (currentStep === 5) fitSheet(); });
function printOfficialForm() {
  pushAll(); const m = missingFields();
  if (m.length && !confirm('Please check: ' + m.join(', ') + '.\n\nPrint anyway?')) return;
  saveClient(true); window.print();
}
window.addEventListener('afterprint', () => toast('Saved ' + currentId() + '. Press “Next client” for the next number.'));

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
(function init() {
  const draft = store.get('nira_draft', null);
  if (draft && draft.tracking) setAll(draft); else { setVal('tracking', freeSerial()); applyLocked(); }
  if (!store.set('nira_cfg', cfg)) toast('Browser storage is blocked, so numbers and saved clients cannot be remembered.');
  refreshStatus();
})();
goToStep(1);
</script>
</body>
